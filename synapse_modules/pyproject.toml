[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-modules"
version = "0.1.0"
description = "Custom Synapse modules including Mixpanel analytics and cleanup invites (auto-leave + cancel API)"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "USBC", email = "support@usbc.xyz"},
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/globalid/synapse"

[tool.setuptools.packages.find]
where = [".."]
include = ["synapse_modules", "synapse_modules.*"]
